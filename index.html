<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="数理统计互动演示索引：通过抽样、绘图与参数调整探索概率统计概念。">
  <title>数理统计互动演示 · mathStat</title>
  <style>
    :root { color-scheme: light; --blue: #14406b; --ink: #233343; --muted: #586778; --line: #d6dfe7; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 1rem; line-height: 1.7; }
    main { max-width: 960px; margin: 0 auto; padding: 56px 36px; }
    header { border-bottom: 2px solid var(--blue); padding-bottom: 24px; }
    .site-name { margin: 0 0 8px; color: var(--muted); font-size: .875rem; letter-spacing: .08em; }
    h1 { margin: 0; color: var(--blue); font-size: clamp(1.75rem, 4vw, 2.25rem); line-height: 1.35; font-weight: 600; }
    .demo-list { margin: 28px 0 0; padding-left: 1.6rem; }
    .demo-list li { padding: 8px 0 22px 8px; border-bottom: 1px solid var(--line); }
    .demo-list li::marker { color: var(--muted); }
    h2 { margin: 0; font-size: 1.25rem; line-height: 1.5; font-weight: 500; }
    a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 5px; }
    a:hover { color: #a32e2e; }
    a:focus-visible { outline: 3px solid #cf8b17; outline-offset: 5px; border-radius: 2px; }
    .description { margin: 10px 0 0; color: var(--muted); }
    @media (max-width: 620px) {
      main { padding: 32px 20px; }
      header { padding-bottom: 20px; }
      .demo-list { margin-top: 22px; }
      h2 { font-size: 1.125rem; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <p class="site-name">mathStat</p>
    <h1>数理统计互动演示</h1>
  </header>
  <ol class="demo-list" aria-label="互动演示列表">
    <li>
      <h2><a href="./ecdf.html">经验分布函数与总体分布函数</a></h2>
      <p class="description">选择总体分布、调整样本量并随机抽样，观察经验分布函数如何接近总体分布函数。</p>
    </li>
  </ol>
</main>
</body>
</html>
